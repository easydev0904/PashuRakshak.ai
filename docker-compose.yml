services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pashurakshak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pashurakshak}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pashurakshak}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pashurakshak}:${POSTGRES_PASSWORD:-change_me_dev_password}@postgres:5432/${POSTGRES_DB:-pashurakshak}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_generate_a_long_random_secret}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_MINUTES: "10080"
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
      UPLOAD_STORAGE_BACKEND: local
      UPLOAD_DIR: ./uploads
      MAX_UPLOAD_SIZE_MB: "5"
      MODEL_ARTIFACT_PATH: ../ml/models/risk_model.joblib
      MODEL_VERSION: prototype-v1
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/repo/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  backend_uploads:
